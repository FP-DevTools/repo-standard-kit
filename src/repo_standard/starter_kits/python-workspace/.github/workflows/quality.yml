name: Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Run pytest
        run: uv run pytest

      - name: Build packages
        run: |
          if compgen -G "packages/*/pyproject.toml" > /dev/null; then
            uv build --all-packages
          else
            echo "No packages under packages/ yet; nothing to build."
          fi

[project]
name = "__REPO_NAME__-workspace"
version = "0.1.0"
description = "__DESCRIPTION__"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "detect-secrets>=1.5.0",
  "pre-commit>=4.0.0",
  "pre-commit-hooks>=5.0.0",
  "pymarkdownlnt>=0.9.39",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "ty>=0.0.1a16",
]

[tool.ruff]
line-length = 88

[tool.repo-standard]
profile = "python-workspace"
standard = "1"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]

[tool.ty.src]
include = ["packages", "tests"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

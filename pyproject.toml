[project]
name = "repo-standard-kit"
version = "1.0.0"
description = "Portable development standards, starter kits, and bootstrap tooling for software repositories."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Private :: Do Not Upload",
]

[project.scripts]
repo-add-package = "repo_standard.repo_add_package:main"
repo-check = "repo_standard.compliance.cli:main"
repo-init = "repo_standard.repo_init:main"

[dependency-groups]
dev = [
  "detect-secrets>=1.5.0",
  "pre-commit>=4.0.0",
  "pre-commit-hooks>=5.0.0",
  "pymarkdownlnt>=0.9.39",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "ty>=0.0.1a16",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "repo_standard"
source-include = [
  "docs/**",
  "profiles/**",
  "templates/**",
]
source-exclude = [
  "**/.mypy_cache/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.ty_cache/**",
  "**/__pycache__/**",
  "**/*.pyc",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]
